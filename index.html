<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditya AI Chatbot</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}
header {
  text-align: center;
  padding: 25px;
  color: #38bdf8;
}
.chat {
  max-width: 600px;
  margin: 20px auto;
  padding: 20px;
  background: #1e293b;
  border-radius: 16px;
}
#messages {
  height: 320px;
  overflow-y: auto;
  padding: 10px;
}
.message {
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  overflow-wrap: anywhere;
}
.bot { background: #334155; }
.user { background: #075985; text-align: right; }
.controls { display: flex; gap: 8px; }
input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border-radius: 8px;
  border: none;
}
button {
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: #0284c7;
  color: white;
  cursor: pointer;
}
</style>
</head>
<body>
<header>
  <h1>🤖 Aditya AI</h1>
  <p>Your Friendly Chatbot</p>
</header>

<div class="chat">
  <div id="messages" aria-live="polite">
    <div class="message bot">
      Hi Aditya! 👋 Welcome. Ask me something!
    </div>
  </div>
  <form class="controls" id="chatForm">
    <input id="question" placeholder="Type your message..."
      autocomplete="off" required>
    <button type="submit">Send</button>
  </form>
</div>

<script>
const form = document.getElementById("chatForm");
const input = document.getElementById("question");
const messages = document.getElementById("messages");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

form.addEventListener("submit", function(event) {
  event.preventDefault();
  const question = input.value.trim().toLowerCase();
  if (!question) return;

  addMessage(input.value.trim(), "user");
  input.value = "";

  let answer = "Interesting question! I am still learning. 🤖";

  if (question.includes("hello") || question.includes("hi"))
    answer = "Hello Aditya! 👋 How can I help you?";
  else if (question.includes("your name"))
    answer = "I am Aditya AI, your friendly chatbot!";
  else if (question.includes("who are you"))
    answer = "I am a simple chatbot created by Aditya.";
  else if (question.includes("how are you"))
    answer = "I am doing great! Thanks for asking. 😊";
  else if (question.includes("telugu"))
    answer = "Namaskaram! Nenu mee friendly chatbot ni. 🙏";
  else if (question.includes("help"))
    answer = "Sure! Try asking me hello, my name, or how are you.";

  setTimeout(() => addMessage(answer, "bot"), 300);
});
</script>
</body>
</html>
